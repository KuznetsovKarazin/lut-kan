[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lut-kan"
version = "2.2.0"
description = "LUT-based inference for KAN with quantization and benchmarking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Oleksandr Kuznetsov"}]

dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "tqdm>=4.66",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
]
mcu = [
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "platformio>=6.1",
  "pyserial>=3.5",
]
numba = [
  "numba>=0.58",
]
pykan = [
  "torch>=2.1",
  "kan",
]
all = [
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "platformio>=6.1",
  "pyserial>=3.5",
  "numba>=0.58",
  "torch>=2.1",
  "kan",
  "pytest>=7.4",
  "ruff>=0.5",
]

# Installation examples:
# pip install -e .                    # Core only
# pip install -e ".[mcu]"             # Core + MCU tools
# pip install -e ".[mcu,numba]"       # Core + MCU + Numba acceleration
# pip install -e ".[all]"             # Everything

[project.scripts]
lut-kan-run = "scripts.run_experiment:main"
lut-kan-smoke = "scripts.smoke_config:main"
lut-kan-bench-scaling = "scripts.bench_scaling:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*","scripts*"]

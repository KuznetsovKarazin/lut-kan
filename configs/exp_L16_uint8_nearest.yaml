# configs/exp_L16_uint8_nearest.yaml
_base_: "spec.yaml"

experiment:
  name: "L16_uint8_nearest_v1"
  group: "sensitivity_L"
  description: "L=16, uint8 asymmetric, nearest"

converter:
  build_lut:
    L: 16
  interp:
    mode: "nearest"
  quant:
    dtype: "uint8"
    scheme: "asymmetric"
    qmin: 0
    qmax: 255
    zero_point: "auto"

logging:
  out_dir: "outputs/exp_runs/L16_uint8_nearest_v1"

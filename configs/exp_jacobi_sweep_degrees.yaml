# configs/exp_jacobi_sweep_degrees.yaml
# Sweep over polynomial degrees (2-6) as tested in paper Table 2
_base_: spec.yaml
experiment:
  name: jacobi_degree_sweep
  group: jacobi_analysis
  description: "Sweep Jacobi polynomial degrees 2-6 per paper Table 2"

logging:
  out_dir: outputs/exp_runs/jacobi_degree_sweep
  versioning: increment

runtime:
  seed: 4
  device: cpu
  num_threads: 1
  deterministic: true

evaluation_inputs:
  num_samples: 2048
  batch_size: 256
  inputs:
    distribution: normal
    mean: 0.0
    std: 1.0
    clip_min: -3.0
    clip_max: 3.0

float_model:
  backend: jacobi
  checkpoint: ""
  adapter: jacobi
  arch:
    in_dim: 16
    out_dim: 16
    degree: 3  # Will be overridden by sweep
    alpha: 1.0  # Gegenbauer as in paper
    beta: 1.0
    use_tanh: true
    x_min: -3.0
    x_max: 3.0
    num_knots: 9

converter:
  enabled: true
  build_lut:
    L: 64
    x_range_mode: knots
  interp:
    mode: linear
  oob_policy:
    mode: clip_x
  y_range:
    method: percentile
    lower_percentile: 0.1
    upper_percentile: 99.9
  quant:
    dtype: uint8
    scheme: asymmetric

phi_error:
  enable: true

speed:
  enable: true

# Sweep parameters
sweep:
  parameter: float_model.arch.degree
  values: [2, 3, 4, 5, 6]

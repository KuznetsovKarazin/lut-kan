_base_: spec.yaml
experiment:
  name: L64_int8_symmetric_nearest_v1
  group: sensitivity_grid
  description: L=64, dtype=int8, scheme=symmetric, interp=nearest
converter:
  build_lut:
    L: 64
  interp:
    mode: nearest
  quant:
    dtype: int8
    scheme: symmetric
    qmin: -127
    qmax: 127
    zero_point: 0
logging:
  out_dir: outputs/exp_runs/L64_int8_symmetric_nearest_v1

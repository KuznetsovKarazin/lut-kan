_base_: spec.yaml
experiment:
  name: L32_int8_symmetric_nearest_v1
  group: sensitivity_grid
  description: L=32, dtype=int8, scheme=symmetric, interp=nearest
converter:
  build_lut:
    L: 32
  interp:
    mode: nearest
  quant:
    dtype: int8
    scheme: symmetric
    qmin: -127
    qmax: 127
    zero_point: 0
logging:
  out_dir: outputs/exp_runs/L32_int8_symmetric_nearest_v1

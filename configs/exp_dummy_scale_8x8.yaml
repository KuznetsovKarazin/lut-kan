_base_: "spec.yaml"

experiment:
  name: "dummy_scale_8x8_L32_v1"
  group: "dummy_scaling"
  description: "Dummy 8x8 layer, L=32"

float_model:
  backend: "dummy"
  checkpoint: "unused"
  adapter: "src/models/dummy_adapter.py"
  arch:
    in_dim: 8
    out_dim: 8
    num_knots: 9
    x_min: -3.0
    x_max: 3.0

converter:
  enabled: true
  build_lut:
    L: 32
  interp:
    mode: "linear"
  quant:
    dtype: "uint8"
    scheme: "asymmetric"

calibration:
  num_samples: 4096

logging:
  out_dir: "outputs/exp_runs/dummy_scaling"
  versioning: "increment"
